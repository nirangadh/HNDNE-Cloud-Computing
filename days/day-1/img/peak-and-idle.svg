<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" role="img" aria-labelledby="peak-t peak-d"><title id="peak-t">Capacity sized for the peak, and the demand it meets</title><desc id="peak-d">A chart of one day at Thara's patient portal. Demand is low overnight, rises sharply at 07:00, stays high until 10:00 in the outpatient peak, then falls to a moderate level for the rest of the day. A dashed line shows a bought server's capacity, fixed at the height of the peak all day. The area between the two is idle capacity that is paid for and not used. Elastic capacity would follow the demand line.</desc><rect width="640" height="346" fill="#FFFFFF"/><text x="70" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">One day at the patient portal</text><path d="M70 84 L610 84 L610.0 252 L565.0 248 L508.8 226 L452.5 192 L340.0 186 L315.2 168 L295.0 96 L232.0 96 L218.5 200 L193.8 248 L70.0 252 Z" fill="#DEF5F1"/><path d="M70.0 252 L193.8 248 L218.5 200 L232.0 96 L295.0 96 L315.2 168 L340.0 186 L452.5 192 L508.8 226 L565.0 248 L610.0 252 L610 270 L70 270 Z" fill="#48C9B0"/><path d="M70.0 252 L193.8 248 L218.5 200 L232.0 96 L295.0 96 L315.2 168 L340.0 186 L452.5 192 L508.8 226 L565.0 248 L610.0 252" fill="none" stroke="#2A7A7A" stroke-width="2.5" stroke-linejoin="round"/><path d="M70 84 L610 84" stroke="#0D2B45" stroke-width="2.5" stroke-dasharray="8 5"/><path d="M70 270 L610 270" stroke="#0D2B45" stroke-width="1.5"/><path d="M70 50 L70 270" stroke="#0D2B45" stroke-width="1.5"/><text x="610" y="74" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Bought server: capacity sized for the peak</text><text x="457.0" y="142" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0D2B45">Idle capacity: paid for, not used</text><text x="416.5" y="246" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0D2B45">Demand: elastic capacity follows this line</text><path d="M227.5 62 L227.5 56 L295.0 56 L295.0 62" fill="none" stroke="#E86A5B" stroke-width="2"/><text x="261.2" y="48" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">OPD peak</text><path d="M227.5 270 L227.5 277" stroke="#0D2B45" stroke-width="1.5"/><text x="227.5" y="294" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0D2B45">07:00</text><path d="M295.0 270 L295.0 277" stroke="#0D2B45" stroke-width="1.5"/><text x="295.0" y="294" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0D2B45">10:00</text><text x="70" y="294" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">midnight</text><text x="610" y="294" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">midnight</text><text x="70" y="318" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">A bought server must be as large as the busiest three hours of the day.</text><text x="70" y="335" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">Elastic capacity is only as large as the demand at that moment.</text></svg>
