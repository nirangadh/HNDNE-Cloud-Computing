<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="rta-t rta-d"><title id="rta-t">Root for five steps, then the admin user</title><desc id="rta-d">Two lanes for the ten steps of the lab. On the root user's lane are steps 1 to 5: confirm the account is active, secure root with MFA, let IAM users see billing, create the admin user and give it MFA. After step 5 the root user is put away and never used again in this module. An arrow hands over to the admin user's lane, which carries steps 6 to 10: sign in and set the region to Mumbai, create the budget, switch on Cost Explorer, read Trusted Advisor and write the first ledger row.</desc><rect width="640" height="270" fill="#FFFFFF"/><text x="14" y="30" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">Today's ten steps, and who does them</text><rect x="8" y="58" width="624" height="84" rx="8" fill="#F7F7F7"/><rect x="8" y="152" width="624" height="84" rx="8" fill="#EDFAF7"/><text x="18" y="100" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">Root user</text><text x="18" y="118" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">owns the account</text><text x="18" y="186" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">Admin user</text><text x="18" y="204" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A7A7A">admin-&lt;student id&gt;</text><path d="M176 106 L368 106" stroke="#0D2B45" stroke-width="3"/><path d="M386 106 L608 106" stroke="#AAAAAA" stroke-width="2" stroke-dasharray="5 5"/><text x="624" y="132" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">put away for the rest of the module</text><path d="M368 122 C368 160 416 146 416 170" fill="none" stroke="#E86A5B" stroke-width="2.5"/><path d="M410 162 L416 173 L422 162 Z" fill="#E86A5B"/><path d="M416 190 L608 190" stroke="#2A7A7A" stroke-width="3"/><text x="438" y="164" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">sign out of root, sign in as admin</text><circle cx="176" cy="106" r="15" fill="#0D2B45" stroke="#0D2B45" stroke-width="1.5"/><text x="176" y="111" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">1</text><circle cx="224" cy="106" r="15" fill="#0D2B45" stroke="#0D2B45" stroke-width="1.5"/><text x="224" y="111" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">2</text><circle cx="272" cy="106" r="15" fill="#0D2B45" stroke="#0D2B45" stroke-width="1.5"/><text x="272" y="111" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">3</text><circle cx="320" cy="106" r="15" fill="#0D2B45" stroke="#0D2B45" stroke-width="1.5"/><text x="320" y="111" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">4</text><circle cx="368" cy="106" r="15" fill="#0D2B45" stroke="#0D2B45" stroke-width="1.5"/><text x="368" y="111" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">5</text><circle cx="416" cy="190" r="15" fill="#48C9B0" stroke="#0D2B45" stroke-width="1.5"/><text x="416" y="195" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#0D2B45">6</text><circle cx="464" cy="190" r="15" fill="#48C9B0" stroke="#0D2B45" stroke-width="1.5"/><text x="464" y="195" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#0D2B45">7</text><circle cx="512" cy="190" r="15" fill="#48C9B0" stroke="#0D2B45" stroke-width="1.5"/><text x="512" y="195" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#0D2B45">8</text><circle cx="560" cy="190" r="15" fill="#48C9B0" stroke="#0D2B45" stroke-width="1.5"/><text x="560" y="195" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#0D2B45">9</text><circle cx="608" cy="190" r="15" fill="#48C9B0" stroke="#0D2B45" stroke-width="1.5"/><text x="608" y="195" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#0D2B45">10</text><text x="160" y="78" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">1 account active · 2 root MFA · 3 billing access · 4 create admin · 5 admin MFA</text><text x="160" y="226" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">6 sign in, Mumbai · 7 budget · 8 Cost Explorer · 9 Trusted Advisor · 10 ledger</text><text x="14" y="258" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">Signed in as root after step 5? Stop: sign out and use the admin user.</text></svg>
