<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="rz-t rz-d"><title id="rz-t">A region, its availability zones and their data centres</title><desc id="rz-d">On the left, Colombo: one building whose basement server room is under water. On the right, the Asia Pacific (Mumbai) region, ap-south-1, drawn as a box holding three availability zones joined by fast links. Each zone holds two or three data centres with their own power, cooling and network. Outside the region a row of small dots stands for edge locations, which are near users, cache content and run no servers.</desc><rect width="640" height="340" fill="#FFFFFF"/><text x="96" y="80" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">Colombo</text><rect x="46" y="96" width="100" height="120" rx="4" fill="#F7F7F7" stroke="#AAAAAA" stroke-width="2"/><rect x="58" y="110" width="18" height="18" rx="2" fill="#BBBBBB"/><rect x="86" y="110" width="18" height="18" rx="2" fill="#BBBBBB"/><rect x="114" y="110" width="18" height="18" rx="2" fill="#BBBBBB"/><rect x="58" y="142" width="18" height="18" rx="2" fill="#BBBBBB"/><rect x="86" y="142" width="18" height="18" rx="2" fill="#BBBBBB"/><rect x="114" y="142" width="18" height="18" rx="2" fill="#BBBBBB"/><rect x="58" y="174" width="18" height="18" rx="2" fill="#BBBBBB"/><rect x="86" y="174" width="18" height="18" rx="2" fill="#BBBBBB"/><rect x="114" y="174" width="18" height="18" rx="2" fill="#BBBBBB"/><path d="M20 216 L172 216" stroke="#0D2B45" stroke-width="2"/><rect x="46" y="218" width="100" height="46" rx="3" fill="#0D2B45"/><rect x="56" y="226" width="34" height="30" rx="2" fill="#133B50"/><circle cx="64" cy="234" r="3" fill="#E86A5B"/><rect x="100" y="226" width="34" height="30" rx="2" fill="#133B50"/><circle cx="108" cy="234" r="3" fill="#E86A5B"/><rect x="46" y="240" width="100" height="24" rx="3" fill="#48C9B0" opacity=".6"/><text x="96" y="288" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0D2B45">One basement.</text><text x="96" y="306" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#0D2B45">One flood took everything.</text><rect x="200" y="14" width="426" height="268" rx="10" fill="#EDFAF7" stroke="#48C9B0" stroke-width="2.5"/><text x="214" y="40" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">Region: Asia Pacific (Mumbai)</text><text x="612" y="40" text-anchor="end" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#2A7A7A">ap-south-1</text><rect x="212" y="58" width="130" height="176" rx="6" fill="#FFFFFF" stroke="#546472" stroke-width="1.5" stroke-dasharray="6 4"/><text x="277" y="80" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Availability zone</text><rect x="243.0" y="104" width="30" height="40" rx="3" fill="#0D2B45"/><rect x="248.0" y="110" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="252.0" cy="113" r="1.8" fill="#48C9B0"/><rect x="248.0" y="121" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="252.0" cy="124" r="1.8" fill="#48C9B0"/><rect x="248.0" y="132" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="252.0" cy="135" r="1.8" fill="#48C9B0"/><rect x="281.0" y="104" width="30" height="40" rx="3" fill="#0D2B45"/><rect x="286.0" y="110" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="290.0" cy="113" r="1.8" fill="#48C9B0"/><rect x="286.0" y="121" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="290.0" cy="124" r="1.8" fill="#48C9B0"/><rect x="286.0" y="132" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="290.0" cy="135" r="1.8" fill="#48C9B0"/><text x="277" y="170" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">2 data centres</text><text x="277" y="196" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">own power,</text><text x="277" y="212" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">cooling, network</text><rect x="348" y="58" width="130" height="176" rx="6" fill="#FFFFFF" stroke="#546472" stroke-width="1.5" stroke-dasharray="6 4"/><text x="413" y="80" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Availability zone</text><rect x="360.0" y="104" width="30" height="40" rx="3" fill="#0D2B45"/><rect x="365.0" y="110" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="369.0" cy="113" r="1.8" fill="#48C9B0"/><rect x="365.0" y="121" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="369.0" cy="124" r="1.8" fill="#48C9B0"/><rect x="365.0" y="132" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="369.0" cy="135" r="1.8" fill="#48C9B0"/><rect x="398.0" y="104" width="30" height="40" rx="3" fill="#0D2B45"/><rect x="403.0" y="110" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="407.0" cy="113" r="1.8" fill="#48C9B0"/><rect x="403.0" y="121" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="407.0" cy="124" r="1.8" fill="#48C9B0"/><rect x="403.0" y="132" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="407.0" cy="135" r="1.8" fill="#48C9B0"/><rect x="436.0" y="104" width="30" height="40" rx="3" fill="#0D2B45"/><rect x="441.0" y="110" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="445.0" cy="113" r="1.8" fill="#48C9B0"/><rect x="441.0" y="121" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="445.0" cy="124" r="1.8" fill="#48C9B0"/><rect x="441.0" y="132" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="445.0" cy="135" r="1.8" fill="#48C9B0"/><text x="413" y="170" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">3 data centres</text><text x="413" y="196" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">own power,</text><text x="413" y="212" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">cooling, network</text><rect x="484" y="58" width="130" height="176" rx="6" fill="#FFFFFF" stroke="#546472" stroke-width="1.5" stroke-dasharray="6 4"/><text x="549" y="80" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Availability zone</text><rect x="515.0" y="104" width="30" height="40" rx="3" fill="#0D2B45"/><rect x="520.0" y="110" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="524.0" cy="113" r="1.8" fill="#48C9B0"/><rect x="520.0" y="121" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="524.0" cy="124" r="1.8" fill="#48C9B0"/><rect x="520.0" y="132" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="524.0" cy="135" r="1.8" fill="#48C9B0"/><rect x="553.0" y="104" width="30" height="40" rx="3" fill="#0D2B45"/><rect x="558.0" y="110" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="562.0" cy="113" r="1.8" fill="#48C9B0"/><rect x="558.0" y="121" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="562.0" cy="124" r="1.8" fill="#48C9B0"/><rect x="558.0" y="132" width="20" height="6" rx="1.5" fill="#133B50"/><circle cx="562.0" cy="135" r="1.8" fill="#48C9B0"/><text x="549" y="170" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">2 data centres</text><text x="549" y="196" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">own power,</text><text x="549" y="212" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">cooling, network</text><path d="M336 124 L354 124" stroke="#48C9B0" stroke-width="5" stroke-linecap="round"/><path d="M472 124 L490 124" stroke="#48C9B0" stroke-width="5" stroke-linecap="round"/><text x="413" y="258" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">A region is a group of zones. Each zone is one or more data centres.</text><text x="413" y="274" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">Lose one building and the other zones keep running.</text><circle cx="212" cy="312" r="6" fill="#F4B942" stroke="#0D2B45" stroke-width="1.2"/><circle cx="230" cy="312" r="6" fill="#F4B942" stroke="#0D2B45" stroke-width="1.2"/><circle cx="248" cy="312" r="6" fill="#F4B942" stroke="#0D2B45" stroke-width="1.2"/><circle cx="266" cy="312" r="6" fill="#F4B942" stroke="#0D2B45" stroke-width="1.2"/><circle cx="284" cy="312" r="6" fill="#F4B942" stroke="#0D2B45" stroke-width="1.2"/><text x="304" y="317" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">Edge locations: near users, cache content, run no servers</text></svg>
