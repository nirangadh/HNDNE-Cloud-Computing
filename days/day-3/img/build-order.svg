<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="ord-t ord-d"><title id="ord-t">Each piece needs the one before it</title><desc id="ord-d">Six numbered boxes in a row, joined by arrows: 1 the VPC, thara-vpc; 2 the subnets, four in two zones; 3 the gateway, attached; 4 the route tables, public and private; 5 the associations of subnet to table; 6 the instances, last. Below: 2 needs 1 because subnets are slices of the VPC's range; 3 needs 1 because the gateway is attached to one VPC; 4 needs 3 because a route can only point at an attached gateway; 5 needs 2 and 4, and until it is associated a subnet uses the main route table; 6 needs 5, because an instance launched earlier looks broken when it is not.</desc><rect width="640" height="300" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">Each piece needs the one before it</text><rect x="9" y="44" width="92" height="76" rx="8" fill="#DEF5F1" stroke="#0D2B45" stroke-width="1.5"/><circle cx="25" cy="60" r="10" fill="#0D2B45"/><text x="25" y="64.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">1</text><text x="55" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">The VPC</text><text x="55" y="108" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">thara-vpc</text><path d="M101 82 L107 82" fill="none" stroke="#0D2B45" stroke-width="2"/><path d="M105 76 L115 82 L105 88 Z" fill="#0D2B45"/><rect x="115" y="44" width="92" height="76" rx="8" fill="#DEF5F1" stroke="#0D2B45" stroke-width="1.5"/><circle cx="131" cy="60" r="10" fill="#0D2B45"/><text x="131" y="64.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">2</text><text x="161" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">The subnets</text><text x="161" y="108" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">four, two zones</text><path d="M207 82 L213 82" fill="none" stroke="#0D2B45" stroke-width="2"/><path d="M211 76 L221 82 L211 88 Z" fill="#0D2B45"/><rect x="221" y="44" width="92" height="76" rx="8" fill="#DEF5F1" stroke="#0D2B45" stroke-width="1.5"/><circle cx="237" cy="60" r="10" fill="#0D2B45"/><text x="237" y="64.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">3</text><text x="267" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">The gateway</text><text x="267" y="108" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">attached</text><path d="M313 82 L319 82" fill="none" stroke="#0D2B45" stroke-width="2"/><path d="M317 76 L327 82 L317 88 Z" fill="#0D2B45"/><rect x="327" y="44" width="92" height="76" rx="8" fill="#DEF5F1" stroke="#0D2B45" stroke-width="1.5"/><circle cx="343" cy="60" r="10" fill="#0D2B45"/><text x="343" y="64.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">4</text><text x="373" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">Route tables</text><text x="373" y="108" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">public, private</text><path d="M419 82 L425 82" fill="none" stroke="#0D2B45" stroke-width="2"/><path d="M423 76 L433 82 L423 88 Z" fill="#0D2B45"/><rect x="433" y="44" width="92" height="76" rx="8" fill="#DEF5F1" stroke="#0D2B45" stroke-width="1.5"/><circle cx="449" cy="60" r="10" fill="#0D2B45"/><text x="449" y="64.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">5</text><text x="479" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">Associations</text><text x="479" y="108" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">subnet to table</text><path d="M525 82 L531 82" fill="none" stroke="#0D2B45" stroke-width="2"/><path d="M529 76 L539 82 L529 88 Z" fill="#0D2B45"/><rect x="539" y="44" width="92" height="76" rx="8" fill="#48C9B0" stroke="#0D2B45" stroke-width="1.5"/><circle cx="555" cy="60" r="10" fill="#0D2B45"/><text x="555" y="64.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">6</text><text x="585" y="90" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">Instances</text><text x="585" y="108" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">last</text><text x="14" y="152" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">2 needs 1</text><text x="128" y="152" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">Subnets are slices of the VPC's range.</text><text x="14" y="176" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">3 needs 1</text><text x="128" y="176" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">The gateway is attached to one VPC.</text><text x="14" y="200" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">4 needs 3</text><text x="128" y="200" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">A route can only point at a gateway that is attached.</text><text x="14" y="224" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">5 needs 2 and 4</text><text x="128" y="224" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">Until it is associated, a subnet uses the main route table: no way out.</text><text x="14" y="248" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">6 needs 5</text><text x="128" y="248" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">Launched earlier, an instance looks broken when it is not: SSH times out.</text><text x="14" y="286" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">When SSH times out, walk back from 6 to 1 and find the missing piece.</text></svg>
