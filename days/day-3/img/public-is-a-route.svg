<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" role="img" aria-labelledby="pub-t pub-d"><title id="pub-t">What makes a subnet public</title><desc id="pub-d">Inside the outline of thara-vpc, 10.0.0.0/16, two subnets are drawn alike, each with an instance and a route table. Both tables hold the route 10.0.0.0/16 to local. The left table also holds 0.0.0.0/0 to the gateway, and an arrow rises from it to the internet gateway above: that subnet is public. The right table has no other route: that subnet is private.</desc><rect width="640" height="372" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">What makes a subnet public</text><rect x="92" y="40" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><text x="167" y="62" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Internet gateway</text><rect x="8" y="92" width="624" height="212" rx="10" fill="none" stroke="#48C9B0" stroke-width="2.5"/><text x="620" y="112" text-anchor="end" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A7A7A">thara-vpc 10.0.0.0/16</text><rect x="20" y="122" width="294" height="170" rx="8" fill="#DEF5F1" stroke="#2A7A7A" stroke-width="1.8" stroke-dasharray="7 5"/><text x="32" y="144" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">a subnet</text><rect x="32" y="196" width="84" height="46" rx="6" fill="#0D2B45"/><rect x="40" y="204" width="68" height="11" rx="2" fill="#48C9B0"/><rect x="40" y="222" width="68" height="11" rx="2" fill="#133B50"/><circle cx="48" cy="227.5" r="2.8" fill="#F4B942"/><text x="74" y="262" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">an instance</text><rect x="128" y="160" width="176" height="92" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="1.5"/><text x="216" y="180" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">its route table</text><text x="140" y="204" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="600" fill="#0D2B45">10.0.0.0/16</text><text x="292" y="204" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#0D2B45">local</text><rect x="134" y="216" width="164" height="26" rx="3" fill="#48C9B0"/><text x="140" y="234" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0D2B45">0.0.0.0/0</text><text x="292" y="234" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">gateway</text><rect x="326" y="122" width="294" height="170" rx="8" fill="#F7F7F7" stroke="#0D2B45" stroke-width="1.8" stroke-dasharray="7 5"/><text x="338" y="144" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">a subnet</text><rect x="338" y="196" width="84" height="46" rx="6" fill="#0D2B45"/><rect x="346" y="204" width="68" height="11" rx="2" fill="#48C9B0"/><rect x="346" y="222" width="68" height="11" rx="2" fill="#133B50"/><circle cx="354" cy="227.5" r="2.8" fill="#F4B942"/><text x="380" y="262" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">an instance</text><rect x="434" y="160" width="176" height="92" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="1.5"/><text x="522" y="180" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">its route table</text><text x="446" y="204" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="600" fill="#0D2B45">10.0.0.0/16</text><text x="598" y="204" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#0D2B45">local</text><text x="522" y="234" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#546472">no other route</text><path d="M216 160 L216 84" fill="none" stroke="#2A7A7A" stroke-width="3"/><path d="M210 86 L216 76 L222 86 Z" fill="#2A7A7A"/><text x="167" y="326" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A7A7A">PUBLIC</text><text x="473" y="326" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#0D2B45">PRIVATE</text><text x="14" y="350" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">The subnets are drawn alike and could carry any name. The default route decides.</text><text x="14" y="366" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">To be reached from the internet, an instance in the public one also needs a public address.</text></svg>
