<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-labelledby="fw-t fw-d"><title id="fw-t">Two firewalls on one path</title><desc id="fw-d">Your laptop, sending from the ephemeral port 51544, is on the left. On the right is a subnet with a network ACL drawn as a bar at its edge and, inside, an instance on port 22 surrounded by a security group. A request arrow passes point 1 at the network ACL and point 2 at the security group. A reply arrow returns through point 3 at the security group, which remembers the request, and point 4 at the network ACL, which judges the reply as a new packet and needs its own outbound rule for ports 1024 to 65535.</desc><rect width="640" height="356" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">Two firewalls on one path</text><rect x="14" y="132" width="96" height="92" rx="8" fill="#F7F7F7" stroke="#AAAAAA" stroke-width="1.5"/><text x="62" y="158" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">your laptop</text><text x="62" y="180" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#546472">port 51544</text><text x="62" y="200" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">ephemeral</text><rect x="232" y="50" width="394" height="238" rx="8" fill="#DEF5F1" stroke="#2A7A7A" stroke-width="1.8" stroke-dasharray="7 5"/><text x="614" y="72" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A7A7A">the subnet</text><rect x="218" y="96" width="28" height="164" rx="5" fill="#0D2B45"/><text x="232" y="86" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">network ACL</text><rect x="420" y="100" width="190" height="156" rx="14" fill="#FFFFFF" stroke="#2A7A7A" stroke-width="5"/><text x="515" y="124" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">security group</text><rect x="473" y="150" width="84" height="46" rx="6" fill="#0D2B45"/><rect x="481" y="158" width="68" height="11" rx="2" fill="#48C9B0"/><rect x="481" y="176" width="68" height="11" rx="2" fill="#133B50"/><circle cx="489" cy="181.5" r="2.8" fill="#F4B942"/><text x="515" y="216" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">the instance</text><text x="515" y="236" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#546472">port 22</text><path d="M110 152 L462 152" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M460 146 L470 152 L460 158 Z" fill="#0D2B45"/><path d="M470 204 L118 204" fill="none" stroke="#2A7A7A" stroke-width="3"/><path d="M120 198 L110 204 L120 210 Z" fill="#2A7A7A"/><circle cx="232" cy="152" r="10" fill="#48C9B0" stroke="#FFFFFF" stroke-width="2"/><circle cx="232" cy="204" r="10" fill="#F4B942" stroke="#FFFFFF" stroke-width="2"/><circle cx="420" cy="152" r="10" fill="#48C9B0" stroke="#FFFFFF" stroke-width="2"/><circle cx="420" cy="204" r="10" fill="#48C9B0" stroke="#FFFFFF" stroke-width="2"/><text x="326" y="142" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">request</text><text x="326" y="226" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#2A7A7A">reply</text><text x="232" y="157" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">1</text><text x="420" y="157" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">2</text><text x="420" y="209" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">3</text><text x="232" y="209" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">4</text><text x="254" y="254" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">4: judged as a new</text><text x="254" y="270" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">packet. Needs its own rule</text><text x="14" y="312" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">1 and 2: the request is checked by the network ACL, then by the security group.</text><text x="14" y="330" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">3: the security group remembers the request, so the reply leaves with no rule consulted.</text><text x="14" y="348" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">4: the network ACL remembers nothing. Without an outbound rule for 1024-65535 the reply dies here.</text></svg>
