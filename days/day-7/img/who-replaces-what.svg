<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="wrw-t wrw-d"><title id="wrw-t">Who does what: four resources, one job each</title><desc id="wrw-d">A diagram of four resources. The load balancer thara-alb shares the requests between the web servers in the target group thara-web-tg and checks the health of each. The target group holds two web servers and has room for a third. The Auto Scaling group thara-web-asg, with a minimum of 2, a desired number of 2 and a maximum of 3, is told when a server is unhealthy and starts a new one in its place. An alarm with a scaling policy, which fires when average CPU is above 50%, tells the group to keep one more. Every new server is started from the launch template thara-web-lt. The group counts servers and the load balancer routes requests; neither does the other's job.</desc><rect width="640" height="360" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">Who does what: four resources, one job each</text><rect x="20" y="46" width="250" height="50" rx="6" fill="#0D2B45" stroke="#0D2B45" stroke-width="2"/><text x="145.0" y="67.0" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Load balancer</text><text x="145.0" y="84.0" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#FFFFFF">thara-alb</text><text x="20" y="114" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">shares the requests, and checks health</text><path d="M100 122 L100 150" fill="none" stroke="#0D2B45" stroke-width="2.5"/><path d="M94 148 L100 158 L106 148 Z" fill="#0D2B45"/><rect x="20" y="158" width="250" height="112" rx="8" fill="#EDFAF7" stroke="#2A7A7A" stroke-width="1.5" stroke-dasharray="6 4"/><text x="32" y="178" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Target group</text><text x="128" y="178" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#0D2B45">thara-web-tg</text><rect x="34" y="192" width="66" height="40" rx="6" fill="#0D2B45"/><rect x="42" y="200" width="50" height="11" rx="2" fill="#48C9B0"/><rect x="42" y="218" width="50" height="11" rx="2" fill="#133B50"/><circle cx="50" cy="223.5" r="2.8" fill="#F4B942"/><rect x="110" y="192" width="66" height="40" rx="6" fill="#0D2B45"/><rect x="118" y="200" width="50" height="11" rx="2" fill="#48C9B0"/><rect x="118" y="218" width="50" height="11" rx="2" fill="#133B50"/><circle cx="126" cy="223.5" r="2.8" fill="#F4B942"/><rect x="186" y="192" width="66" height="40" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2" stroke-dasharray="5 4"/><rect x="194" y="200" width="50" height="11" rx="2" fill="none" stroke="#AAAAAA" stroke-width="1.5"/><text x="34" y="254" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">two web servers, and room for a third</text><rect x="424" y="46" width="196" height="50" rx="6" fill="#F4B942" stroke="#0D2B45" stroke-width="2"/><text x="522.0" y="67.0" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Alarm, with a scaling policy</text><text x="522.0" y="84.0" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">average CPU above 50%</text><path d="M522 96 L522 150" fill="none" stroke="#0D2B45" stroke-width="2.5"/><path d="M516 148 L522 158 L528 148 Z" fill="#0D2B45"/><text x="532" y="132" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">one more</text><rect x="424" y="158" width="196" height="66" rx="6" fill="#DEF5F1" stroke="#0D2B45" stroke-width="3"/><text x="522.0" y="178.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Auto Scaling group</text><text x="522.0" y="195.5" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#0D2B45">thara-web-asg</text><text x="522.0" y="212.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">minimum 2, desired 2, maximum 3</text><rect x="424" y="282" width="196" height="50" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="522.0" y="303.0" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Launch template</text><text x="522.0" y="320.0" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#0D2B45">thara-web-lt</text><path d="M522 282 L522 232" fill="none" stroke="#0D2B45" stroke-width="2.5"/><path d="M516 234 L522 224 L528 234 Z" fill="#0D2B45"/><text x="532" y="258" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">what a server is</text><path d="M270 178 L416 178" fill="none" stroke="#E86A5B" stroke-width="2.5"/><path d="M414 172 L424 178 L414 184 Z" fill="#E86A5B"/><text x="345" y="170" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">this one is unhealthy</text><path d="M424 210 L278 210" fill="none" stroke="#0D2B45" stroke-width="2.5"/><path d="M280 204 L270 210 L280 216 Z" fill="#0D2B45"/><text x="345" y="230" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">starts a new server</text><text x="20" y="300" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">The group counts servers and starts new ones.</text><text x="20" y="318" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">The load balancer routes requests. Neither does</text><text x="20" y="336" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">the other's job, and you create both.</text></svg>
