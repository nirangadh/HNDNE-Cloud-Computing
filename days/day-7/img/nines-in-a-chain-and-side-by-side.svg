<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="nines-t nines-d"><title id="nines-t">The same numbers, two different sums</title><desc id="nines-d">Two panels. On the left, three parts in a chain: a load balancer, the web tier and the records database, each available 99.9% of the time. A request needs every one, so the three multiply to about 99.7%, which is about 131 minutes of downtime a month, worse than the 44 minutes of any one part. On the right, two web servers side by side, each available 99% of the time. Either one is enough, so the service is down only when both are: 1% of 1% of the time. That is four nines, about 4 minutes a month, better than the 438 minutes of either server alone. A month is counted as 730 hours.</desc><rect width="640" height="330" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">The same numbers, two different sums</text><rect x="14" y="42" width="318" height="246" rx="8" fill="#F7F7F7" stroke="#BBBBBB" stroke-width="1.5"/><text x="28" y="66" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">In a chain</text><text x="28" y="84" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A7A7A">every part must work</text><rect x="28" y="104" width="84" height="54" rx="6" fill="#0D2B45" stroke="#0D2B45" stroke-width="2"/><text x="70.0" y="118.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Load</text><text x="70.0" y="135.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">balancer</text><text x="70.0" y="152.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">99.9%</text><path d="M112 131 L124 131" fill="none" stroke="#0D2B45" stroke-width="2.5"/><path d="M122 125 L132 131 L122 137 Z" fill="#0D2B45"/><rect x="132" y="104" width="84" height="54" rx="6" fill="#0D2B45" stroke="#0D2B45" stroke-width="2"/><text x="174.0" y="118.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Web</text><text x="174.0" y="135.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">tier</text><text x="174.0" y="152.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">99.9%</text><path d="M216 131 L228 131" fill="none" stroke="#0D2B45" stroke-width="2.5"/><path d="M226 125 L236 131 L226 137 Z" fill="#0D2B45"/><rect x="236" y="104" width="84" height="54" rx="6" fill="#0D2B45" stroke="#0D2B45" stroke-width="2"/><text x="278.0" y="118.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Records</text><text x="278.0" y="135.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">database</text><text x="278.0" y="152.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">99.9%</text><text x="173" y="188" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0D2B45">99.9% x 99.9% x 99.9%</text><text x="173" y="212" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">about 99.7%</text><rect x="60" y="226" width="226" height="28" rx="4" fill="#F4B942" stroke="#0D2B45" stroke-width="1.5"/><text x="173" y="245" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">about 131 minutes a month</text><text x="173" y="276" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">worse than any one part (44 minutes)</text><rect x="344" y="42" width="282" height="246" rx="8" fill="#F7F7F7" stroke="#BBBBBB" stroke-width="1.5"/><text x="358" y="66" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">Side by side</text><text x="358" y="84" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A7A7A">either one is enough</text><path d="M372 131 L392 131 M392 112 L392 150 M392 112 L412 112 M392 150 L412 150 M556 112 L576 112 M556 150 L576 150 M576 112 L576 150 M576 131 L598 131" fill="none" stroke="#0D2B45" stroke-width="2.5"/><rect x="412" y="96" width="144" height="32" rx="6" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2"/><text x="484.0" y="116.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Web server, 99%</text><rect x="412" y="134" width="144" height="32" rx="6" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2"/><text x="484.0" y="154.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Web server, 99%</text><text x="485" y="188" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#0D2B45">1% x 1% of the time, both down</text><text x="485" y="212" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">99.<tspan>99</tspan>%</text><rect x="386" y="226" width="198" height="28" rx="4" fill="#48C9B0" stroke="#0D2B45" stroke-width="1.5"/><text x="485" y="245" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">about 4 minutes a month</text><text x="485" y="276" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">better than either one (438 minutes)</text><text x="14" y="312" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">A month is 730 hours: 43,800 minutes. Side by side works only if the two do not fail together.</text></svg>
