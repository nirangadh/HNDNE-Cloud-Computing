<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="gtm-t gtm-d"><title id="gtm-t">The group through the morning</title><desc id="gtm-d">A stepped line showing how many web servers the Auto Scaling group runs during the morning lab, between its minimum of 2 and its maximum of 3. At step 5 the group is created and runs two. At step 9 the alarm fires and the group runs three. At step 10 one server is terminated, so two remain, and the group replaces it and runs three again: the time between is the measured replacement time. At teardown the group is deleted and no servers run.</desc><rect width="640" height="330" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">The group through the morning</text><text x="14" y="46" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">web servers running</text><path d="M70 250 L600 250" stroke="#D3DADF" stroke-width="1.5"/><text x="58" y="254" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">0</text><path d="M70 200 L600 200" stroke="#D3DADF" stroke-width="1.5"/><text x="58" y="204" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">1</text><path d="M70 150 L600 150" stroke="#D3DADF" stroke-width="1.5"/><text x="58" y="154" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">2</text><path d="M70 100 L600 100" stroke="#D3DADF" stroke-width="1.5"/><text x="58" y="104" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">3</text><path d="M70 150 L600 150" stroke="#2A7A7A" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M70 100 L600 100" stroke="#2A7A7A" stroke-width="1.5" stroke-dasharray="6 4"/><text x="604" y="154" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A7A7A">min</text><text x="604" y="104" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A7A7A">max</text><path d="M70 250 L70 150 L220 150 L220 100 L340 100 L340 150 L430 150 L430 100 L515 100 L515 250 L590 250" fill="none" stroke="#0D2B45" stroke-width="4" stroke-linejoin="round"/><circle cx="70" cy="150" r="8" fill="#48C9B0" stroke="#0D2B45" stroke-width="2"/><circle cx="220" cy="100" r="8" fill="#F4B942" stroke="#0D2B45" stroke-width="2"/><circle cx="340" cy="150" r="8" fill="#E86A5B" stroke="#0D2B45" stroke-width="2"/><circle cx="430" cy="100" r="8" fill="#48C9B0" stroke="#0D2B45" stroke-width="2"/><circle cx="515" cy="250" r="8" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="76" y="282" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">step 5</text><text x="76" y="299" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">group created</text><text x="220" y="282" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">step 9</text><text x="220" y="299" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">alarm: one more</text><text x="385" y="282" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">step 10</text><text x="385" y="299" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">terminated, replaced</text><text x="555" y="282" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">teardown</text><text x="555" y="299" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">group deleted</text><path d="M340 164 L430 164 M340 158 L340 170 M430 158 L430 170" stroke="#546472" stroke-width="1.5" fill="none"/><text x="385.0" y="184" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">your measured</text><text x="385.0" y="200" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">replacement time</text><text x="14" y="322" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">This line is what the group's activity history records, and what you screenshot.</text></svg>
