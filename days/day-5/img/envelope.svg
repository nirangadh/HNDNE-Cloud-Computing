<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" role="img" aria-labelledby="env-t env-d"><title id="env-t">Envelope encryption: which key is where</title><desc id="env-d">Three boxes. On the left is KMS, which holds the KMS key, alias/thara-records, and never gives it out. In the middle is memory, which holds the data key in the clear only while it is needed. On the right is the volume as stored, which holds the encrypted data and the data key in sealed form. Step 1: KMS makes the data key. Step 2: the data key encrypts the data. Step 3: the sealed data key is stored beside the data.</desc><rect width="640" height="344" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">Envelope encryption: which key is where</text><rect x="14" y="44" width="186" height="190" rx="8" fill="#0D2B45"/><text x="28" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">KMS</text><text x="28" y="88" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#BBBBBB">never gives a key out</text><rect x="28" y="110" width="158" height="56" rx="6" fill="#133B50" stroke="#48C9B0" stroke-width="2"/><text x="107" y="134" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">the KMS key</text><text x="107" y="153" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#FFFFFF">alias/thara-records</text><rect x="227" y="44" width="186" height="190" rx="8" fill="#F7F7F7" stroke="#BBBBBB" stroke-width="1.5"/><text x="241" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">In memory</text><text x="241" y="88" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">only while it is needed</text><rect x="241" y="110" width="158" height="56" rx="6" fill="#F4B942" stroke="#0D2B45" stroke-width="2"/><text x="320" y="134" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">the data key</text><text x="320" y="153" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">in the clear</text><rect x="440" y="44" width="186" height="190" rx="8" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><text x="454" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">The volume, as stored</text><text x="454" y="88" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">what a copied disk holds</text><rect x="454" y="110" width="158" height="48" rx="6" fill="#133B50"/><text x="533" y="139" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">encrypted data</text><rect x="454" y="170" width="158" height="48" rx="6" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2" stroke-dasharray="7 5"/><text x="533" y="199" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">the data key, sealed</text><path d="M186 138 L231 138" fill="none" stroke="#48C9B0" stroke-width="3.5"/><path d="M229 132 L239 138 L229 144 Z" fill="#48C9B0"/><path d="M399 134 L444 134" fill="none" stroke="#0D2B45" stroke-width="3.5"/><path d="M442 128 L452 134 L442 140 Z" fill="#0D2B45"/><circle cx="213" cy="138" r="10" fill="#F4B942" stroke="#FFFFFF" stroke-width="2"/><text x="213" y="142.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">1</text><circle cx="426" cy="134" r="10" fill="#F4B942" stroke="#FFFFFF" stroke-width="2"/><text x="426" y="138.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">2</text><path d="M320 166 L320 194 L444 194" fill="none" stroke="#0D2B45" stroke-width="3" stroke-dasharray="6 5"/><path d="M444 194 L434 188 L434 200 Z" fill="#0D2B45"/><circle cx="320" cy="194" r="10" fill="#F4B942" stroke="#FFFFFF" stroke-width="2"/><text x="320" y="198.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">3</text><text x="14" y="262" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">1: KMS makes a data key and hands it over twice, once in the clear and once sealed under the KMS key.</text><text x="14" y="280" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">2: the data is encrypted with the clear data key, which is then thrown away.</text><text x="14" y="298" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">3: the sealed data key is stored beside the data. Only KMS can open it again.</text><text x="14" y="322" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">The KMS key never leaves KMS. A stolen copy of the volume holds nothing that opens it.</text></svg>
