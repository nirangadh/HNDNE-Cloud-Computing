<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="dad-t dad-d"><title id="dad-t">How AWS decides: deny, then allow, then no</title><desc id="dad-d">A request passes through two questions in order. First: does an explicit deny match? If yes, the request is denied explicitly, nothing overrides it, and the only cure is to remove the deny. If no, second: does an allow match? If yes, the request is allowed. If no, third, the request is denied implicitly, because nothing allowed it, and the cure is to add an allow.</desc><rect width="640" height="330" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">How AWS decides: deny, then allow, then no</text><rect x="10" y="76" width="92" height="44" rx="22" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><text x="56" y="103" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">A request</text><path d="M102 98 L120 98" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M118 92 L128 98 L118 104 Z" fill="#0D2B45"/><rect x="128" y="66" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><circle cx="132" cy="66" r="11" fill="#F4B942" stroke="#FFFFFF" stroke-width="2"/><text x="132" y="70.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">1</text><text x="213.0" y="94" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">An explicit deny?</text><text x="213.0" y="114" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">checked first</text><path d="M298 98 L338 98" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M336 92 L346 98 L336 104 Z" fill="#0D2B45"/><text x="320" y="88" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#546472">no</text><path d="M213.0 130 L213.0 172" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M207.0 170 L213.0 180 L219.0 170 Z" fill="#0D2B45"/><text x="225.0" y="158" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#546472">yes</text><rect x="346" y="66" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><circle cx="350" cy="66" r="11" fill="#F4B942" stroke="#FFFFFF" stroke-width="2"/><text x="350" y="70.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">2</text><text x="421.0" y="94" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">An allow?</text><text x="421.0" y="114" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">checked second</text><path d="M496 98 L536 98" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M534 92 L544 98 L534 104 Z" fill="#0D2B45"/><text x="518" y="88" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#546472">no</text><path d="M421.0 130 L421.0 172" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M415.0 170 L421.0 180 L427.0 170 Z" fill="#0D2B45"/><text x="433.0" y="158" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#546472">yes</text><rect x="128" y="182" width="170" height="56" rx="8" fill="#FFFFFF" stroke="#E86A5B" stroke-width="4"/><text x="213" y="206" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#0D2B45">Denied</text><text x="213" y="226" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">explicitly</text><rect x="346" y="182" width="150" height="56" rx="8" fill="#48C9B0" stroke="#0D2B45" stroke-width="2"/><text x="421" y="216" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="800" fill="#0D2B45">Allowed</text><rect x="544" y="66" width="88" height="64" rx="8" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5" stroke-dasharray="7 5"/><circle cx="548" cy="66" r="11" fill="#F4B942" stroke="#FFFFFF" stroke-width="2"/><text x="548" y="70.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">3</text><text x="588" y="94" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="800" fill="#0D2B45">Denied</text><text x="588" y="114" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">implicitly</text><text x="128" y="264" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">Nothing overrides it.</text><text x="128" y="282" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">The only cure is to</text><text x="128" y="300" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">remove the deny.</text><text x="346" y="264" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">One statement allows</text><text x="346" y="282" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">this action on</text><text x="346" y="300" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">this resource.</text><text x="632" y="156" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">Nothing allowed it.</text><text x="632" y="174" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">The cure is to</text><text x="632" y="192" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">add an allow.</text><text x="14" y="322" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">Two ways to be refused, with two different cures.</text></svg>
