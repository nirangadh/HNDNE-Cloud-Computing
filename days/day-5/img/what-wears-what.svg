<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" role="img" aria-labelledby="www-t www-d"><title id="www-t">What is attached to what</title><desc id="www-d">A chain from left to right. The instance thara-web-1 is given an instance profile. Inside the instance profile is the role thara-web-role, and inside the role is the policy thara-reports-read. Two arrows leave the role: the action s3:ListBucket reaches the bucket thara-reports, and the action s3:GetObject reaches the objects in it.</desc><rect width="640" height="316" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">What is attached to what</text><rect x="22" y="78" width="96" height="52" rx="6" fill="#0D2B45"/><rect x="30" y="86" width="80" height="11" rx="2" fill="#48C9B0"/><rect x="30" y="104" width="80" height="11" rx="2" fill="#133B50"/><circle cx="38" cy="109.5" r="2.8" fill="#F4B942"/><text x="70" y="150" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">thara-web-1</text><text x="70" y="168" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">the instance</text><path d="M118 104 L142 104" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M140 98 L150 104 L140 110 Z" fill="#0D2B45"/><rect x="150" y="50" width="196" height="150" rx="8" fill="#DEF5F1" stroke="#2A7A7A" stroke-width="1.8" stroke-dasharray="7 5"/><text x="162" y="70" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">instance profile</text><rect x="162" y="80" width="172" height="108" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><text x="174" y="100" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A7A7A">thara-web-role</text><text x="174" y="118" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">the role</text><rect x="174" y="130" width="148" height="46" rx="5" fill="#48C9B0" stroke="#0D2B45" stroke-width="1.5"/><text x="248" y="150" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">thara-reports-read</text><text x="248" y="167" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">the policy</text><path d="M346 96 L462 96" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M460 90 L470 96 L460 102 Z" fill="#0D2B45"/><text x="408" y="86" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">s3:ListBucket</text><path d="M346 162 L462 162" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M460 156 L470 162 L460 168 Z" fill="#0D2B45"/><text x="408" y="152" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">s3:GetObject</text><path d="M484 66 L616 66 L606 124 L494 124 Z" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><ellipse cx="550.0" cy="66" rx="66.0" ry="9" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2.5"/><text x="550" y="104" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">the bucket</text><rect x="484" y="142" width="132" height="42" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="550" y="168" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">the objects in it</text><text x="626" y="204" text-anchor="end" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#2A7A7A">thara-reports-&lt;student id&gt;</text><text x="14" y="236" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">The instance is given an instance profile. The profile holds one role. The role carries the policy.</text><text x="14" y="254" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">The policy names two actions: one on the bucket, one on the objects in it.</text><text x="14" y="272" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">The role's trust policy says who may assume it: the EC2 service, for this instance.</text><text x="14" y="296" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">Nothing in this chain is a file on the server. The credentials arrive, expire and are renewed.</text></svg>
