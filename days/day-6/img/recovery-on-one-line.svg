<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-labelledby="rol-t rol-d"><title id="rol-t">One failure, two spans</title><desc id="rol-d">A time line with four marks in order: the last backup, the failure, the start of the restore and the return of service. The span from the last backup to the failure is the data lost. It is set against the RPO and is decided before the failure, by how often you back up. The span from the failure to the return of service is the time down. It is set against the RTO and is decided after the failure, by how long a restore takes.</desc><rect width="640" height="312" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">One failure, two spans</text><rect x="60" y="109" width="240" height="26" fill="#F4B942" stroke="#0D2B45" stroke-width="1.5"/><rect x="300" y="109" width="280" height="26" fill="#133B50" stroke="#0D2B45" stroke-width="1.5"/><text x="180.0" y="127" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">data lost</text><text x="490.0" y="127" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">service down</text><path d="M60 90 L60 154" stroke="#0D2B45" stroke-width="2.5"/><circle cx="60" cy="122" r="8" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="60" y="66" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Last backup</text><text x="60" y="83" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">the last good copy</text><path d="M300 90 L300 154" stroke="#0D2B45" stroke-width="2.5"/><circle cx="300" cy="122" r="8" fill="#E86A5B" stroke="#0D2B45" stroke-width="2"/><text x="300" y="174" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Failure</text><text x="300" y="191" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">the clock starts</text><path d="M400 90 L400 154" stroke="#0D2B45" stroke-width="2.5"/><circle cx="400" cy="122" r="8" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="400" y="66" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Restore starts</text><text x="400" y="83" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">noticed, and begun</text><path d="M580 90 L580 154" stroke="#0D2B45" stroke-width="2.5"/><circle cx="580" cy="122" r="8" fill="#48C9B0" stroke="#0D2B45" stroke-width="2"/><text x="580" y="174" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Service returns</text><text x="580" y="191" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">the data is checked</text><path d="M60 204 L300 204 M60 198 L60 210 M300 198 L300 210" stroke="#546472" stroke-width="1.5" fill="none"/><path d="M300 204 L580 204 M580 198 L580 210" stroke="#546472" stroke-width="1.5" fill="none"/><text x="180.0" y="226" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">set against the RPO</text><text x="440.0" y="226" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">set against the RTO</text><text x="180.0" y="246" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">decided before the failure,</text><text x="180.0" y="263" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">by how often you back up</text><text x="440.0" y="246" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">decided after the failure,</text><text x="440.0" y="263" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">by how long a restore takes</text><text x="14" y="298" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">Thara's targets for patient records: at most one hour lost, at most two hours down.</text></svg>
