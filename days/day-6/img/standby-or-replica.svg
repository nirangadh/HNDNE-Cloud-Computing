<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" role="img" aria-labelledby="sor-t sor-d"><title id="sor-t">A second copy, for two different reasons</title><desc id="sor-d">Two panels, each with the web tier above a primary database and a second copy. On the left, Multi-AZ, for availability: the web tier uses one endpoint, which reaches the primary. Every write is copied to a standby before it is confirmed. The standby answers nothing, and takes over by itself if the primary fails. On the right, a read replica, for scale: the web tier sends writes to the primary and reads to the replica, at an endpoint of its own. Changes follow a moment behind, and if the primary fails a person must promote the replica.</desc><rect width="640" height="336" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">A second copy, for two different reasons</text><rect x="14" y="42" width="298" height="238" rx="8" fill="#F7F7F7" stroke="#BBBBBB" stroke-width="1.5"/><text x="28" y="66" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">Multi-AZ</text><text x="28" y="84" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A7A7A">for availability</text><rect x="103" y="96" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="163" y="116" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">the web tier</text><rect x="32" y="168" width="112" height="58" rx="6" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2.5"/><text x="88" y="192" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Primary</text><text x="88" y="210" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">reads and writes</text><rect x="182" y="168" width="112" height="58" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5" stroke-dasharray="7 5"/><text x="238" y="192" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Standby</text><text x="238" y="210" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">answers nothing</text><path d="M144 197 L174 197" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M172 191 L182 197 L172 203 Z" fill="#0D2B45"/><path d="M124 126 L124 160" fill="none" stroke="#2A7A7A" stroke-width="3"/><path d="M118 158 L124 168 L130 158 Z" fill="#2A7A7A"/><text x="28" y="152" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">one endpoint</text><text x="163" y="248" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">every write is copied before it is confirmed</text><text x="28" y="302" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">If the primary fails: the standby takes over.</text><text x="28" y="320" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">By itself, usually within a minute or two.</text><rect x="328" y="42" width="298" height="238" rx="8" fill="#F7F7F7" stroke="#BBBBBB" stroke-width="1.5"/><text x="342" y="66" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">Read replica</text><text x="342" y="84" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#2A7A7A">for scale</text><rect x="417" y="96" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="477" y="116" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">the web tier</text><rect x="346" y="168" width="112" height="58" rx="6" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2.5"/><text x="402" y="192" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Primary</text><text x="402" y="210" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">reads and writes</text><rect x="496" y="168" width="112" height="58" rx="6" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2.5"/><text x="552" y="192" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Replica</text><text x="552" y="210" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">answers reads</text><path d="M458 197 L488 197" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M486 191 L496 197 L486 203 Z" fill="#0D2B45"/><path d="M438 126 L438 160" fill="none" stroke="#2A7A7A" stroke-width="3"/><path d="M432 158 L438 168 L444 158 Z" fill="#2A7A7A"/><text x="342" y="152" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">writes</text><text x="477" y="248" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">changes follow a moment behind</text><text x="342" y="302" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">If the primary fails: nothing takes over.</text><text x="342" y="320" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">A person must promote the replica.</text><path d="M518 126 L518 160" fill="none" stroke="#2A7A7A" stroke-width="3" stroke-dasharray="6 4"/><path d="M512 158 L518 168 L524 158 Z" fill="#2A7A7A"/><text x="612" y="152" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">reads</text></svg>
