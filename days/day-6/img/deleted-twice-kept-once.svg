<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="dtk-t dtk-d"><title id="dtk-t">The afternoon: deleted twice, kept once</title><desc id="dtk-d">Two lanes across the afternoon. In the database lane, thara-records is created and given three rows, a snapshot named thara-records-snap1 is taken, and the database is deleted. A second database, thara-records-r1, is restored from the snapshot, its rows are checked, and it is deleted as well. The time from the first deletion to the checked rows is the measured RTO. The snapshot runs on to the end of the afternoon and is kept. In the bucket lane, versioning, the lifecycle rule and the bucket policy are done while the database is being created, and the Backup plan thara-daily comes last.</desc><rect width="640" height="330" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">The afternoon: deleted twice, kept once</text><text x="14" y="62" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">The database</text><text x="14" y="206" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">The reports bucket</text><path d="M14 182 L626 182" stroke="#BBBBBB" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="14" y="74" width="196" height="42" rx="6" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2"/><text x="112.0" y="92" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">thara-records</text><text x="112.0" y="108" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">created, three rows</text><circle cx="226" cy="95" r="11" fill="#FFFFFF" stroke="#E86A5B" stroke-width="3"/><path d="M221 90 L231 100 M231 90 L221 100" stroke="#0D2B45" stroke-width="2.5"/><text x="226" y="126" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">deleted</text><path d="M226 60 L424 60 M226 54 L226 66 M424 54 L424 66" stroke="#546472" stroke-width="1.5" fill="none"/><text x="325" y="52" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">your measured RTO</text><rect x="268" y="74" width="156" height="42" rx="6" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2"/><text x="346.0" y="92" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">thara-records-r1</text><text x="346.0" y="108" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">restored, rows checked</text><circle cx="440" cy="95" r="11" fill="#FFFFFF" stroke="#E86A5B" stroke-width="3"/><path d="M435 90 L445 100 M445 90 L435 100" stroke="#0D2B45" stroke-width="2.5"/><text x="440" y="126" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">deleted</text><rect x="160" y="138" width="466" height="30" rx="6" fill="#48C9B0" stroke="#0D2B45" stroke-width="2"/><text x="172" y="158" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">thara-records-snap1</text><text x="614" y="158" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">kept</text><path d="M160 116 L160 130" fill="none" stroke="#0D2B45" stroke-width="2.5"/><path d="M154 128 L160 138 L166 128 Z" fill="#0D2B45"/><path d="M300 138 L300 124" fill="none" stroke="#0D2B45" stroke-width="2.5"/><path d="M294 126 L300 116 L306 126 Z" fill="#0D2B45"/><rect x="14" y="218" width="130" height="42" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="79.0" y="236" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">versioning</text><text x="79.0" y="252" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">two, then three</text><rect x="152" y="218" width="130" height="42" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="217.0" y="236" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">lifecycle rule</text><text x="217.0" y="252" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">enabled, not watched</text><rect x="290" y="218" width="130" height="42" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="355.0" y="236" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">bucket policy</text><text x="355.0" y="252" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">names the role</text><text x="14" y="284" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">The bucket work fills the minutes in which the database is being created.</text><text x="14" y="302" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">At the end no database exists and nothing bills by the hour. The snapshot is what remains.</text><text x="626" y="206" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">Backup plan, last</text><rect x="496" y="218" width="130" height="42" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="561.0" y="236" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">thara-daily</text><text x="561.0" y="252" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">back up, restore</text></svg>
