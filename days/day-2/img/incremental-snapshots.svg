<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-labelledby="inc-t inc-d"><title id="inc-t">Snapshots are incremental</title><desc id="inc-d">One volume is drawn as a row of eight blocks at three moments. At the first snapshot six blocks are in use, and the snapshot stores all six. One night later three blocks have changed, and the second snapshot stores only those three and reads the rest from the first. Two nights later one block has changed, and the third snapshot stores that one block. Any one of the three restores the whole volume.</desc><rect width="640" height="356" fill="#FFFFFF"/><text x="14" y="28" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">What each snapshot of one volume stores</text><rect x="8" y="76" width="624" height="62" rx="8" fill="#F7F7F7"/><rect x="8" y="170" width="624" height="92" rx="8" fill="#EDFAF7"/><text x="18" y="104" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">The volume</text><text x="18" y="122" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">at that moment</text><text x="18" y="204" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">The snapshot</text><text x="18" y="222" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">taken then</text><text x="237" y="64" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">First snapshot</text><rect x="166" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="184" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="202" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="220" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="238" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="256" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="274" y="92" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/><rect x="292" y="92" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/><path d="M237 142 L237 160" stroke="#0D2B45" stroke-width="2"/><path d="M231 156 L237 167 L243 156 Z" fill="#0D2B45"/><rect x="166" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="184" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="202" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="220" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="238" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="256" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="274" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/><rect x="292" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/><text x="237" y="236" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">stores 6 blocks</text><text x="397" y="64" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">One night later</text><rect x="326" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="344" y="92" width="15" height="28" rx="2" fill="#F4B942" stroke="#0D2B45" stroke-width="1.5"/><rect x="362" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="380" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="398" y="92" width="15" height="28" rx="2" fill="#F4B942" stroke="#0D2B45" stroke-width="1.5"/><rect x="416" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="434" y="92" width="15" height="28" rx="2" fill="#F4B942" stroke="#0D2B45" stroke-width="1.5"/><rect x="452" y="92" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/><path d="M397 142 L397 160" stroke="#0D2B45" stroke-width="2"/><path d="M391 156 L397 167 L403 156 Z" fill="#0D2B45"/><rect x="326" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="344" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="362" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="380" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="398" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="416" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="434" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="452" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/><text x="397" y="236" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">stores 3 blocks</text><text x="557" y="64" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Two nights later</text><rect x="486" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="504" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="522" y="92" width="15" height="28" rx="2" fill="#F4B942" stroke="#0D2B45" stroke-width="1.5"/><rect x="540" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="558" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="576" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="594" y="92" width="15" height="28" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><rect x="612" y="92" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/><path d="M557 142 L557 160" stroke="#0D2B45" stroke-width="2"/><path d="M551 156 L557 167 L563 156 Z" fill="#0D2B45"/><rect x="486" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="504" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="522" y="184" width="15" height="28" rx="2" fill="#0D2B45"/><rect x="540" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="558" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="576" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="594" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#546472" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="612" y="184" width="15" height="28" rx="2" fill="#FFFFFF" stroke="#AAAAAA" stroke-width="1"/><text x="557" y="236" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">stores 1 block</text><path d="M322 198 L312 198" stroke="#2A7A7A" stroke-width="2.5"/><path d="M314 192 L304 198 L314 204 Z" fill="#2A7A7A"/><path d="M482 198 L472 198" stroke="#2A7A7A" stroke-width="2.5"/><path d="M474 192 L464 198 L474 204 Z" fill="#2A7A7A"/><text x="326" y="254" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">the rest is read from the earlier snapshots</text><rect x="14" y="282" width="15" height="18" rx="2" fill="#48C9B0" stroke="#0D2B45" stroke-width="1"/><text x="36" y="296" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">block in use</text><rect x="138" y="282" width="15" height="18" rx="2" fill="#F4B942" stroke="#0D2B45" stroke-width="1.5"/><text x="160" y="296" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">changed since the last snapshot</text><rect x="366" y="282" width="15" height="18" rx="2" fill="#0D2B45"/><text x="388" y="296" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">stored in this snapshot</text><text x="14" y="326" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Only the first snapshot is a full copy.</text><text x="14" y="344" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">Restore from any one of the three and you get the whole volume as it was at that moment.</text></svg>
