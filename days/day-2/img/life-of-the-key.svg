<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="lok-t lok-d"><title id="lok-t">The life of the insecure access key</title><desc id="lok-d">A line runs through Day 2, Day 4 and Day 5. On Day 2 the access key is created in step 10, typed into thara-web-1 and used for one upload, with a warning sign beside it; in teardown it is deactivated, and the line becomes dashed because the key still exists and can be switched on. On Day 4 it is active for a few minutes for one test and then inactive again. On Day 5 the line ends at a cross: the key is deleted and an instance role takes its place.</desc><rect width="640" height="300" fill="#FFFFFF"/><text x="14" y="28" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">The life of the insecure access key</text><rect x="8" y="44" width="288" height="216" rx="8" fill="#F7F7F7"/><rect x="304" y="44" width="176" height="216" rx="8" fill="#EDFAF7"/><rect x="488" y="44" width="144" height="216" rx="8" fill="#F7F7F7"/><text x="20" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">Day 2: today</text><text x="316" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">Day 4</text><text x="500" y="68" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">Day 5</text><path d="M50 150 L196 150" stroke="#E86A5B" stroke-width="5" stroke-linecap="round"/><path d="M196 150 L346 150" stroke="#546472" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M346 150 L420 150" stroke="#E86A5B" stroke-width="5" stroke-linecap="round"/><path d="M420 150 L560 150" stroke="#546472" stroke-width="2.5" stroke-dasharray="7 6"/><circle cx="50" cy="150" r="9" fill="#E86A5B" stroke="#0D2B45" stroke-width="2"/><circle cx="196" cy="150" r="9" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><circle cx="346" cy="150" r="9" fill="#E86A5B" stroke="#0D2B45" stroke-width="2"/><circle cx="420" cy="150" r="9" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><path d="M551 141 L569 159 M569 141 L551 159" stroke="#0D2B45" stroke-width="4" stroke-linecap="round"/><circle cx="88" cy="108" r="9" fill="none" stroke="#F4B942" stroke-width="5"/><rect x="98" y="105.5" width="26" height="5" fill="#F4B942"/><rect x="112" y="110" width="4" height="8" fill="#F4B942"/><rect x="119" y="110" width="4" height="6" fill="#F4B942"/><circle cx="88" cy="108" r="12" fill="none" stroke="#0D2B45" stroke-width="1.2"/><path d="M152 95 L165 117 L139 117 Z" fill="#E86A5B" stroke="#0D2B45" stroke-width="1.5" stroke-linejoin="round"/><rect x="150.5" y="103" width="3" height="8" fill="#0D2B45"/><circle cx="152" cy="114" r="1.6" fill="#0D2B45"/><circle cx="212" cy="108" r="9" fill="none" stroke="#BBBBBB" stroke-width="5"/><rect x="222" y="105.5" width="26" height="5" fill="#BBBBBB"/><rect x="236" y="110" width="4" height="8" fill="#BBBBBB"/><rect x="243" y="110" width="4" height="6" fill="#BBBBBB"/><circle cx="212" cy="108" r="12" fill="none" stroke="#0D2B45" stroke-width="1.2"/><circle cx="356" cy="108" r="9" fill="none" stroke="#F4B942" stroke-width="5"/><rect x="366" y="105.5" width="26" height="5" fill="#F4B942"/><rect x="380" y="110" width="4" height="8" fill="#F4B942"/><rect x="387" y="110" width="4" height="6" fill="#F4B942"/><circle cx="356" cy="108" r="12" fill="none" stroke="#0D2B45" stroke-width="1.2"/><path d="M420 95 L433 117 L407 117 Z" fill="#E86A5B" stroke="#0D2B45" stroke-width="1.5" stroke-linejoin="round"/><rect x="418.5" y="103" width="3" height="8" fill="#0D2B45"/><circle cx="420" cy="114" r="1.6" fill="#0D2B45"/><text x="123" y="136" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">ACTIVE</text><text x="250" y="136" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#546472">INACTIVE</text><text x="383" y="136" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">ACTIVE</text><text x="20" y="184" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">Step 10: created,</text><text x="20" y="200" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">typed into</text><text x="20" y="216" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="600" fill="#2A7A7A">thara-web-1,</text><text x="20" y="232" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">one upload</text><text x="160" y="184" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">Teardown:</text><text x="160" y="200" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">deactivated.</text><text x="160" y="216" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">It still exists</text><text x="160" y="232" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">and can be</text><text x="160" y="248" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">switched on</text><text x="316" y="184" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">On for a few</text><text x="316" y="200" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">minutes, one</text><text x="316" y="216" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">test, off again</text><text x="500" y="184" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">Deleted.</text><text x="500" y="200" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">An instance role</text><text x="500" y="216" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">takes its place</text><text x="14" y="284" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">Inactive is not gone. Until Day 5 your ledger note is what records that this key exists.</text></svg>
