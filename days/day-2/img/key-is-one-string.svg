<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" role="img" aria-labelledby="keys-t keys-d"><title id="keys-t">A file share has folders; a bucket has keys</title><desc id="keys-d">On the left, a file share: a folder named reports holds a folder named kandy, which holds the file r-1042.pdf. The folders are real, and the file is opened, changed and saved in place. On the right, the bucket thara-reports-&lt;student id>, with a padlock for Block Public Access: a flat list of three keys, each one long string such as reports/kandy/r-1042.pdf. Below the list are the only three actions: put a whole object, get a whole object, delete it.</desc><rect width="640" height="348" fill="#FFFFFF"/><rect x="8" y="12" width="270" height="270" rx="10" fill="#F7F7F7" stroke="#AAAAAA" stroke-width="1.5"/><text x="22" y="40" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">A file share</text><path d="M26 66 L35 66 L38 62 L52 62 L52 82 L26 82 Z" fill="#F4B942" stroke="#0D2B45" stroke-width="1.2"/><text x="60" y="78" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="600" fill="#0D2B45">reports</text><path d="M38 84 L38 112 L58 112" fill="none" stroke="#546472" stroke-width="1.5"/><path d="M62 104 L71 104 L74 100 L88 100 L88 120 L62 120 Z" fill="#F4B942" stroke="#0D2B45" stroke-width="1.2"/><text x="96" y="116" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="600" fill="#0D2B45">kandy</text><path d="M74 122 L74 152 L96 152" fill="none" stroke="#546472" stroke-width="1.5"/><path d="M100 138 L114 138 L120 144 L120 164 L100 164 Z" fill="#FFFFFF" stroke="#0D2B45" stroke-width="1.5"/><rect x="104" y="148" width="12" height="2.5" fill="#2A7A7A"/><rect x="104" y="154" width="12" height="2.5" fill="#BBBBBB"/><text x="128" y="157" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="600" fill="#0D2B45">r-1042.pdf</text><text x="22" y="206" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">The folders are real.</text><text x="22" y="226" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">Browse into them, open the file,</text><text x="22" y="243" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">change page 3 and save it in place.</text><text x="22" y="268" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">You mount it like a disk.</text><rect x="292" y="12" width="340" height="270" rx="10" fill="#EDFAF7" stroke="#48C9B0" stroke-width="2.5"/><text x="306" y="40" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">A bucket</text><text x="618" y="40" text-anchor="end" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A7A7A">thara-reports-&lt;student id&gt;</text><path d="M580 60 L580 54 Q580 46 588 46 Q596 46 596 54 L596 60" fill="none" stroke="#0D2B45" stroke-width="3"/><rect x="575" y="59" width="26" height="20" rx="3" fill="#0D2B45"/><circle cx="588" cy="68" r="3" fill="#F4B942"/><rect x="306" y="62" width="256" height="30" rx="4" fill="#FFFFFF" stroke="#546472" stroke-width="1.2"/><path d="M312 64 L326 64 L332 70 L332 90 L312 90 Z" fill="#FFFFFF" stroke="#0D2B45" stroke-width="1.5"/><rect x="316" y="74" width="12" height="2" fill="#2A7A7A"/><rect x="316" y="80" width="12" height="2" fill="#BBBBBB"/><text x="340" y="82" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="600" fill="#0D2B45">reports/kandy/r-1042.pdf</text><rect x="306" y="100" width="256" height="30" rx="4" fill="#FFFFFF" stroke="#546472" stroke-width="1.2"/><path d="M312 102 L326 102 L332 108 L332 128 L312 128 Z" fill="#FFFFFF" stroke="#0D2B45" stroke-width="1.5"/><rect x="316" y="112" width="12" height="2" fill="#2A7A7A"/><rect x="316" y="118" width="12" height="2" fill="#BBBBBB"/><text x="340" y="120" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="600" fill="#0D2B45">reports/kandy/r-1043.pdf</text><rect x="306" y="138" width="256" height="30" rx="4" fill="#FFFFFF" stroke="#546472" stroke-width="1.2"/><path d="M312 140 L326 140 L332 146 L332 166 L312 166 Z" fill="#FFFFFF" stroke="#0D2B45" stroke-width="1.5"/><rect x="316" y="150" width="12" height="2" fill="#2A7A7A"/><rect x="316" y="156" width="12" height="2" fill="#BBBBBB"/><text x="340" y="158" text-anchor="start" font-family="Courier New, monospace" font-size="13" font-weight="600" fill="#0D2B45">reports/galle/r-0077.pdf</text><text x="306" y="190" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Each key is one long string.</text><text x="306" y="208" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">The slashes are characters in the name.</text><rect x="306" y="224" width="100" height="44" rx="6" fill="#48C9B0"/><text x="356" y="243" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#0D2B45">PUT</text><text x="356" y="260" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">a whole object</text><rect x="412" y="224" width="100" height="44" rx="6" fill="#48C9B0"/><text x="462" y="243" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#0D2B45">GET</text><text x="462" y="260" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">a whole object</text><rect x="518" y="224" width="100" height="44" rx="6" fill="#48C9B0"/><text x="568" y="243" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#0D2B45">DELETE</text><text x="568" y="260" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">it</text><text x="14" y="312" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#0D2B45">A key such as reports/kandy/r-1042.pdf looks like a path, and the console draws folders for you.</text><text x="14" y="332" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">Underneath there are none: no mounting, and no editing in the middle of an object.</text></svg>
