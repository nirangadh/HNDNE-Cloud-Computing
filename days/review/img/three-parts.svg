<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="tp-t tp-d"><title id="tp-t">One question, three parts, 35 minutes</title><desc id="tp-d">A question drawn as three steps that rise from left to right, after a short block for reading the scenario and finding its constraints. The first step is part (a), Explain, with 6 marks and about 10 minutes: name the mechanism and say what follows. The second and widest is part (b), Apply, with 8 marks and about 14 minutes: use this scenario's names, numbers and constraints. The third and tallest is part (c), Evaluate, with 6 marks and about 10 minutes: weigh it, choose, and say what would change your view.</desc><rect width="640" height="300" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">One question, three parts, 35 minutes</text><rect x="14" y="202" width="90" height="34" fill="#F7F7F7" stroke="#0D2B45" stroke-width="2" stroke-dasharray="6 4"/><text x="59" y="223" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">Read</text><text x="59" y="176" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">find the</text><text x="59" y="192" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">constraints</text><rect x="104" y="150" width="150" height="86" fill="#48C9B0" stroke="#0D2B45" stroke-width="2"/><text x="179.0" y="176" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">(a) Explain</text><text x="179.0" y="196" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#0D2B45">6 marks</text><text x="179.0" y="258" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">about 10 minutes</text><rect x="254" y="110" width="210" height="126" fill="#2A7A7A" stroke="#0D2B45" stroke-width="2"/><text x="359.0" y="136" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">(b) Apply</text><text x="359.0" y="156" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">8 marks</text><text x="359.0" y="258" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">about 14 minutes</text><rect x="464" y="70" width="150" height="166" fill="#0D2B45" stroke="#0D2B45" stroke-width="2"/><text x="539.0" y="96" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">(c) Evaluate</text><text x="539.0" y="116" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">6 marks</text><text x="539.0" y="258" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">about 10 minutes</text><path d="M14 236 L630 236" stroke="#0D2B45" stroke-width="2.5"/><text x="59" y="258" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#546472">a minute or two</text><text x="179" y="222" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">name it, say what follows</text><text x="359" y="196" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">use this scenario's names,</text><text x="359" y="213" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">numbers and constraints</text><text x="539" y="158" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">weigh it, choose,</text><text x="539" y="175" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">and say what would</text><text x="539" y="192" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF">change your view</text><text x="14" y="286" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">Each step asks for more than the one before. Part (c) is worth as much as part (a).</text></svg>
