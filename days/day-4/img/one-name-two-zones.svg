<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" role="img" aria-labelledby="aln-t aln-d"><title id="aln-t">One name, servers in two zones</title><desc id="aln-d">At the top is one name, with an arrow to a load balancer drawn as a wide bar across two availability zones. In zone a the server is healthy, passes the health check and receives every request. In zone b the server has failed the health check, is crossed out, and receives no requests.</desc><rect width="640" height="356" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">One name, servers in two zones</text><rect x="230" y="40" width="180" height="38" rx="19" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><text x="320" y="64" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">one name</text><path d="M320 78 L320 98" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M314 96 L320 106 L326 96 Z" fill="#0D2B45"/><rect x="96" y="108" width="448" height="46" rx="23" fill="#48C9B0" stroke="#0D2B45" stroke-width="2.5"/><text x="320" y="136" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="14" font-weight="700" fill="#0D2B45">load balancer</text><rect x="70" y="186" width="224" height="112" rx="8" fill="#DEF5F1" stroke="#2A7A7A" stroke-width="1.8" stroke-dasharray="7 5"/><text x="282" y="206" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">zone a</text><rect x="86" y="218" width="84" height="46" rx="6" fill="#0D2B45"/><rect x="94" y="226" width="68" height="11" rx="2" fill="#48C9B0"/><rect x="94" y="244" width="68" height="11" rx="2" fill="#133B50"/><circle cx="102" cy="249.5" r="2.8" fill="#F4B942"/><text x="182" y="238" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#2A7A7A">healthy</text><text x="182" y="256" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">check passed</text><text x="86" y="286" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">receives every request</text><rect x="346" y="186" width="224" height="112" rx="8" fill="#DEF5F1" stroke="#2A7A7A" stroke-width="1.8" stroke-dasharray="7 5"/><text x="558" y="206" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">zone b</text><rect x="362" y="218" width="84" height="46" rx="6" fill="#0D2B45"/><rect x="370" y="226" width="68" height="11" rx="2" fill="#133B50"/><rect x="370" y="244" width="68" height="11" rx="2" fill="#133B50"/><circle cx="378" cy="249.5" r="2.8" fill="#F4B942"/><text x="458" y="238" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="800" fill="#0D2B45">failed</text><text x="458" y="256" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">check failed</text><text x="362" y="286" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">receives no requests</text><path d="M128 154 L128 208" fill="none" stroke="#2A7A7A" stroke-width="3.5"/><path d="M122 206 L128 216 L134 206 Z" fill="#2A7A7A"/><path d="M404 154 L404 204" fill="none" stroke="#AAAAAA" stroke-width="3" stroke-dasharray="6 5"/><path d="M392 229 L416 253 M416 229 L392 253" stroke="#E86A5B" stroke-width="5" stroke-linecap="round"/><text x="14" y="326" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">The load balancer is a managed service with a part in each zone, reached by its own DNS name.</text><text x="14" y="344" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">When a server fails its health check the requests go to the other. The name does not change.</text></svg>
