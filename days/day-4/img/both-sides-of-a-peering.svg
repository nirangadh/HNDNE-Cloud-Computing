<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" role="img" aria-labelledby="peer-t peer-d"><title id="peer-t">A peering needs a route on both sides</title><desc id="peer-d">Two networks side by side: thara-vpc, 10.0.0.0/16, holding thara-web-1, and partnerlab-vpc, 10.1.0.0/16, holding partnerlab-1, joined by a peering connection. Under the first is thara-private-rt with route 1, 10.1.0.0/16 to the peering, which carries the request. Under the second is the partner's route table with route 2, 10.0.0.0/16 to the peering, which carries the reply.</desc><rect width="640" height="348" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">A peering needs a route on both sides</text><rect x="8" y="40" width="260" height="212" rx="10" fill="none" stroke="#48C9B0" stroke-width="2.5"/><text x="20" y="60" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A7A7A">thara-vpc</text><text x="256" y="60" text-anchor="end" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#546472">10.0.0.0/16</text><rect x="372" y="40" width="260" height="212" rx="10" fill="none" stroke="#48C9B0" stroke-width="2.5"/><text x="384" y="60" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A7A7A">partnerlab-vpc</text><text x="620" y="60" text-anchor="end" font-family="Courier New, monospace" font-size="12" font-weight="400" fill="#546472">10.1.0.0/16</text><rect x="170" y="78" width="84" height="46" rx="6" fill="#0D2B45"/><rect x="178" y="86" width="68" height="11" rx="2" fill="#48C9B0"/><rect x="178" y="104" width="68" height="11" rx="2" fill="#133B50"/><circle cx="186" cy="109.5" r="2.8" fill="#F4B942"/><text x="212" y="142" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">thara-web-1</text><rect x="386" y="78" width="84" height="46" rx="6" fill="#0D2B45"/><rect x="394" y="86" width="68" height="11" rx="2" fill="#48C9B0"/><rect x="394" y="104" width="68" height="11" rx="2" fill="#133B50"/><circle cx="402" cy="109.5" r="2.8" fill="#F4B942"/><text x="428" y="142" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">partnerlab-1</text><rect x="268" y="84" width="104" height="34" rx="17" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2"/><text x="320" y="105.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">peering</text><rect x="18" y="160" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="1.5"/><text x="30" y="180" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">thara-private-rt</text><rect x="24" y="192" width="228" height="26" rx="3" fill="#F4B942"/><circle cx="38" cy="205" r="9" fill="#FFFFFF"/><text x="38" y="209.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">1</text><text x="54" y="210" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">10.1.0.0/16</text><text x="246" y="210" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">peering</text><text x="30" y="233" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">plus the local route</text><rect x="382" y="160" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="1.5"/><text x="394" y="180" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">the partner's route table</text><rect x="388" y="192" width="228" height="26" rx="3" fill="#48C9B0"/><circle cx="402" cy="205" r="9" fill="#FFFFFF"/><text x="402" y="209.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">2</text><text x="418" y="210" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">10.0.0.0/16</text><text x="610" y="210" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">peering</text><text x="394" y="233" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">plus the local route</text><text x="14" y="276" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">1: the request leaves thara-web-1. Thara's route table needs a route to the partner's range.</text><text x="14" y="294" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">2: the reply leaves partnerlab-1. The partner's route table needs a route to Thara's range.</text><text x="14" y="318" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">With only route 1 the request arrives and the reply is dropped. The ping fails either way.</text><text x="14" y="336" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">The two ranges must not overlap, or neither table could tell the networks apart.</text></svg>
