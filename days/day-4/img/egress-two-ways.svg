<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="egr-t egr-d"><title id="egr-t">Two ways out of one private subnet</title><desc id="egr-d">Inside thara-vpc are a public subnet holding a NAT gateway with an Elastic IP, and a private subnet holding the server thara-web-1. Path 1 rises from the server to the NAT gateway, passes the internet gateway on the edge of the VPC and reaches the internet: it carries patches and bills by the hour and by the gigabyte. Path 2 runs from the server to a gateway endpoint on the edge of the VPC and on to the reports bucket in Amazon S3: it carries reports inside the AWS network at no charge.</desc><rect width="640" height="380" fill="#FFFFFF"/><text x="14" y="26" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="15" font-weight="700" fill="#0D2B45">Two ways out of one private subnet</text><rect x="474" y="46" width="152" height="40" rx="20" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><text x="550" y="71" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">The internet</text><path d="M486 222 L618 222 L608 296 L496 296 Z" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2.5"/><ellipse cx="552.0" cy="222" rx="66.0" ry="9" fill="#DEF5F1" stroke="#0D2B45" stroke-width="2.5"/><text x="552" y="262" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">reports bucket</text><text x="552" y="280" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">Amazon S3</text><rect x="8" y="40" width="436" height="272" rx="10" fill="none" stroke="#48C9B0" stroke-width="2.5"/><text x="20" y="60" text-anchor="start" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#2A7A7A">thara-vpc</text><rect x="20" y="70" width="412" height="96" rx="8" fill="#DEF5F1" stroke="#2A7A7A" stroke-width="1.8" stroke-dasharray="7 5"/><text x="32" y="90" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">public subnet</text><rect x="20" y="196" width="412" height="104" rx="8" fill="#F7F7F7" stroke="#0D2B45" stroke-width="1.8" stroke-dasharray="7 5"/><text x="420" y="216" text-anchor="end" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">private subnet</text><rect x="196" y="96" width="132" height="52" rx="6" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="262" y="119" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#0D2B45">NAT gateway</text><text x="262" y="137" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#546472">holds an Elastic IP</text><circle cx="444" cy="122" r="17" fill="#FFFFFF" stroke="#0D2B45" stroke-width="2"/><text x="444" y="126.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#0D2B45">IGW</text><rect x="44" y="232" width="84" height="46" rx="6" fill="#0D2B45"/><rect x="52" y="240" width="68" height="11" rx="2" fill="#48C9B0"/><rect x="52" y="258" width="68" height="11" rx="2" fill="#133B50"/><circle cx="60" cy="263.5" r="2.8" fill="#F4B942"/><text x="86" y="294" text-anchor="middle" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#0D2B45">thara-web-1</text><circle cx="444" cy="255" r="17" fill="#48C9B0" stroke="#0D2B45" stroke-width="2"/><text x="444" y="259.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">EP</text><path d="M108 232 L108 180 L262 180 L262 156" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M256 158 L262 148 L268 158 Z" fill="#0D2B45"/><path d="M328 122 L419 122" fill="none" stroke="#0D2B45" stroke-width="3"/><path d="M417 116 L427 122 L417 128 Z" fill="#0D2B45"/><path d="M460 116 L512 87" fill="none" stroke="#0D2B45" stroke-width="3"/><circle cx="108" cy="180" r="10" fill="#F4B942" stroke="#FFFFFF" stroke-width="2"/><text x="108" y="184.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">1</text><path d="M128 255 L419 255" fill="none" stroke="#2A7A7A" stroke-width="3.5"/><path d="M417 249 L427 255 L417 261 Z" fill="#2A7A7A"/><path d="M461 255 L482 255" fill="none" stroke="#2A7A7A" stroke-width="3.5"/><path d="M480 249 L490 255 L480 261 Z" fill="#2A7A7A"/><circle cx="280" cy="255" r="10" fill="#48C9B0" stroke="#FFFFFF" stroke-width="2"/><text x="280" y="259.5" text-anchor="middle" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="800" fill="#0D2B45">2</text><text x="14" y="336" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">1: patches. The default route leads to the NAT gateway, which bills by the hour and by the gigabyte.</text><text x="14" y="354" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D2B45">2: reports. The endpoint's route leads to S3 inside the AWS network, at no charge.</text><text x="14" y="372" text-anchor="start" font-family="Open Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#2A7A7A">Neither path lets anything outside start a connection to the web tier.</text></svg>
